# Weekly dependency PRs for what can be updated mechanically.
#
# Deliberately NOT here:
#   pip    -- the model images pin ACE-Step, Stable Audio 3 and Chatterbox
#             against hand-resolved requirement sets, contract snapshots and a
#             cu128 torch. A bot bump would break that coupling; update them by
#             hand (docs/git-workflow.md#dependencies).
#   docker -- the CUDA base image must stay on a Blackwell-capable 12.8+ tag
#             that matches TORCH_INDEX; change it deliberately, not weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # ESLint and its plugins only upgrade together: eslint 10 alone failed
      # to install (react-hooks 5 rejects it as a peer), and react-hooks 7
      # alone failed on its renamed config. One PR, one upgrade.
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) cannot be adopted yet:
      # typescript-eslint 8.71, the newest release, declares
      # typescript <6.1.0 as its peer, so npm refuses to install them
      # together. Revisit when typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
