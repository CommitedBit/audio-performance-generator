server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback. BrowserRouter serves /settings client-side, so any unknown
    # path must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the model server so the browser sees one origin and CORS is moot.
    location /api/ {
        # Voice references may be up to 25 MB (the gateway and model service
        # both enforce that). nginx's default is 1 MB, which rejected ordinary
        # WAV references with 413 before they reached the backend. 26m leaves
        # room for multipart framing so the backend makes the size decision
        # and returns its own, clearer 413.
        client_max_body_size 26m;

        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The client's own X-API-Key passes straight through to the gateway,
        # which enforces it. nginx must NOT set that header itself: a proxy
        # that attaches the key to every request authenticates anonymous
        # callers too, so API_KEY would protect nothing on an exposed port.

        # Music generation can run for minutes; the defaults would cut it off.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
