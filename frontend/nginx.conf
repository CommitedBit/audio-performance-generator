server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback. BrowserRouter serves /settings client-side, so any unknown
    # path must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the model server so the browser sees one origin and CORS is moot.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Music generation can run for minutes; the defaults would cut it off.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
