[project]
name = "audio-performance-generator-api"
version = "0.1.0"
description = "Local audio generation API: TTS, music and SFX behind one provider interface"
requires-python = ">=3.10"

# Base install: the API runs with these alone, serving the stub providers.
# Model weights and heavy ML deps are opt-in extras so the image stays small
# and CI does not pull 6 GB of CUDA wheels.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.24",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local text-to-speech.
tts = ["chatterbox-tts>=0.1.1"]
# Local music generation via transformers (not audiocraft -- see musicgen.py).
music = ["transformers>=4.44", "torch>=2.4", "torchaudio>=2.4", "scipy>=1.11"]
# Local SFX / ambience via diffusers.
sfx = ["diffusers>=0.30", "transformers>=4.44", "torch>=2.4", "torchaudio>=2.4"]
# Everything local.
all = [
    "chatterbox-tts>=0.1.1",
    "diffusers>=0.30",
    "transformers>=4.44",
    "torch>=2.4",
    "torchaudio>=2.4",
    "scipy>=1.11",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
