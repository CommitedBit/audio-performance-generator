[project]
name = "audio-performance-generator-api"
version = "0.1.0"
description = "Local audio generation API: TTS, music and SFX behind one provider interface"
requires-python = ">=3.10"

# Base install: the API runs with these alone, serving the stub providers.
# Model weights and heavy ML deps are opt-in extras so the image stays small
# and CI does not pull 6 GB of CUDA wheels.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.24",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local text-to-speech. Chatterbox is MIT for code AND weights.
tts = ["chatterbox-tts>=0.1.1"]
# Local music. ACE-Step has MIT weights and is the default; transformers is
# kept for the legacy MusicGen provider.
music = ["acestep>=1.5", "transformers>=4.44", "torch>=2.4", "torchaudio>=2.4", "scipy>=1.11"]
# Local SFX / ambience via Stable Audio 3.
sfx = ["diffusers>=0.31", "transformers>=4.44", "torch>=2.4", "torchaudio>=2.4"]
# flash-attn is MANDATORY for the Stable Audio 3 *medium* checkpoint: without
# it output silently collapses to static. Needs compute capability >= 8.0 and a
# CUDA toolchain to build, so it is its own extra rather than part of `all`.
flash = ["flash-attn>=2.6"]
all = [
    "chatterbox-tts>=0.1.1",
    "acestep>=1.5",
    "diffusers>=0.31",
    "transformers>=4.44",
    "torch>=2.4",
    "torchaudio>=2.4",
    "scipy>=1.11",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

# Pin the CUDA wheel index explicitly. Without this you can silently install
# the default torch wheel, which bundles its own full copy of CUDA -- two
# toolchains in one image and several wasted GB.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI *requires* File()/Form()/Depends() calls in argument defaults.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
